name: Build portable applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: WorkCount-Windows-x64-no-templates
            file: release/WorkCount-Windows-x64-no-templates.zip
            script: tools/build_windows.ps1
          - runner: macos-15-intel
            artifact: WorkCount-macOS-x86_64-no-templates
            file: release/WorkCount-macOS-x86_64-no-templates.zip
            script: tools/build_mac_ci.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.21.0
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_windows.ps1
      - if: runner.os == 'macOS'
        run: bash tools/build_mac_ci.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $connectorResult = '{"username":"","password":""}' | & './release/WorkCount-Windows-x64/PlatformConnector/PlatformConnector.exe'
          if ($LASTEXITCODE -eq 0) { throw 'Connector unexpectedly accepted empty credentials' }
          $connectorJson = $connectorResult | ConvertFrom-Json
          if ($connectorJson.error -notmatch '平台账号和密码不能为空') { throw "Windows connector smoke test failed: $connectorResult" }
          $env:WORKCOUNT_DB = Join-Path $env:RUNNER_TEMP 'portable-smoke.db'
          $server = Start-Process -FilePath './release/WorkCount-Windows-x64/WorkCountServer/WorkCountServer.exe' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/health' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Windows executable did not serve /health' }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - if: runner.os == 'macOS'
        run: |
          export WORKCOUNT_DB="$RUNNER_TEMP/portable-smoke.db"
          ./release/WorkCount-macOS-x86_64/WorkCountServer/WorkCountServer &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8765/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
