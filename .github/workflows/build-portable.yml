name: Build portable applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: WorkCount-Windows-x64-no-templates
            file: release/WorkCount-Windows-x64-no-templates.zip
            script: tools/build_windows.ps1
          - runner: macos-15-intel
            artifact: WorkCount-macOS-x86_64-no-templates
            file: release/WorkCount-macOS-x86_64-no-templates.zip
            script: tools/build_mac_ci.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.21.0
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_windows.ps1
      - if: runner.os == 'macOS'
        run: bash tools/build_mac_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
